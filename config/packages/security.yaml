security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api/v1
            stateless: true
            provider: app_user_provider
            jwt: ~
            entry_point: jwt
            refresh_jwt:
                check_path: /api/v1/auth/refresh
            logout:
                path: /api/v1/auth/logout

    access_control:
        - { path: '^/api/v1/docs', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/auth/(register|verify-email|resend-code|login|2fa|refresh|logout)(/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
