apiVersion: v1
kind: ConfigMap
metadata:
    name: {{.Values.serviceName}}-nginx-config
data:
    default.conf: |
        server {
            listen 80;
            root /var/www/app/public;
            charset utf-8;
            client_max_body_size 4m;

            location ~* ^/(bundles|media|styles|css|js|img|images) {
                    sendfile       on;
                    tcp_nopush     on;
                    aio            on;

                    expires 15s;
                    add_header Cache-Control "public, no-transform";

                    try_files $uri =404;
            }

            location / {
                    include fastcgi_params;
                    fastcgi_pass  localhost:9000;
                    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
                    fastcgi_param DOCUMENT_ROOT $document_root;
                    fastcgi_param REQUEST_URI $request_uri;
            }

            location ~ /\. {
                deny all;
            }
        }

---
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{.Values.serviceName}}-php-config
data:
    xdebug.ini: |
        zend_extension=xdebug
        xdebug.mode=debug,develop
        xdebug.client_host={{.Values.xdebugClientHost}}
        xdebug.client_port={{.Values.xdebugPort}}
        xdebug.start_with_request=yes
        xdebug.idekey={{.Values.xdebugIdeKey}}
